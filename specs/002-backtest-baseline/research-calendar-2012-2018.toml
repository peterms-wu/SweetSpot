# Steam seasonal sales that started 2012-01-01 .. before the 2019 Summer Sale.
# Researched 2026-09-25. steamdb.info was not used. Main sources:
#   - Valve's old Steam News archive at store.steampowered.com/oldnews/<id> (feeds steam_announce and steam_release).
#   - Steam News app 593110 (for Winter 2018).
# Date-only values mean 10:00 Pacific, following the file header. `end` is exclusive: prices return to normal at that time.
# Ready to paste into data/steam_sales.toml in date order, before the 2019 Lunar New Year entry.

[[sale]]
name = "Steam Summer Sale"
name_zh = "夏季特賣"
kind = "seasonal"
season = "summer"
year = 2012
start = "2012-07-12"
end = "2012-07-23"
status = "ended"
source = "https://store.steampowered.com/oldnews/8388"
confidence = "official"
note = "Valve: \"starts today and lasts through Monday, July 23rd, 2012\". Valve's \"FINAL DAY\" post is dated 07-22 and says the sale \"concludes today\" (https://store.steampowered.com/oldnews/8451), so the last full day was 07-22 and prices returned at 10:00 PDT on 07-23. A Wayback snapshot of the store at 2012-07-23 23:43 PDT shows no sale (https://web.archive.org/web/20120724064331/http://store.steampowered.com/). RPS also says \"July 12 to July 22\". The sale had Daily Deals, 8-hour Flash Sales and Community Choice votes."

