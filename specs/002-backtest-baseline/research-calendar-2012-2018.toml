# =====================================================================================
# NOTES
# =====================================================================================
#
# Result: 21 seasonal sales. Every year from 2012 to 2018 has a Summer, an Autumn (Thanksgiving-week) and a
# Winter/Holiday sale. All 21 entries are "official". Every start date and every end date is backed by Valve's
# own posts.
#
# SALES I COULD NOT CONFIRM
#   - None among the seasonal sales.
#   - No year from 2012 to 2018 lacks an Autumn/Thanksgiving sale. In 2014 and 2015 that sale was named the
#     "Steam Exploration Sale".
#   - No Spring seasonal sale existed in 2012–2018. See the judgement calls below.
#
# CLASSIFICATION JUDGEMENT CALLS
#   1. Exploration Sale 2014 (11-26 to 12-02) and 2015 (11-25 to 12-01). Classified as seasonal "autumn".
#      - Both were the store-wide Thanksgiving/Black Friday/Cyber Monday sale, in the Autumn Sale slot.
#      - Both lasted 6 days, like every Autumn Sale in 2012–2018.
#      - Press called them the Autumn Sale (RPS 2014-11-26 "Steam Autumn Sale On"; RPS 2015-11-25 "The Steam
#        Autumn Sale Has Started").
#      - I kept Valve's own name in `name`.
#   2. "Holiday Sale" (2012, 2013, 2014) is the older name of the Winter Sale. Classified as seasonal "winter".
#      Valve renamed it the "Winter Sale" in 2015.
#   3. Encores. In 2014–2018 each Encore ran inside the announced sale window, so the end dates already include
#      it. In 2012 and 2013 the "Holiday Encore Sale" ran after the main sale ended and covered only a few dozen
#      top deals:
#        - 2012: 2013-01-05 to 2013-01-07.
#        - 2013: 2014-01-02 to 2014-01-03.
#      I set `end` to the main-sale end and noted the Encore. If the model should count a few games as
#      discounted for 1–2 more days, extend `end` to the Encore end.
#   4. Similar carry-overs. After Autumn 2012, Valve kept the Day-6 Daily Deals until 2012-11-28 10:00 PT
#      (oldnews/9447). This is treated like an Encore and is not included in `end`.
#   5. "10pm" end times in the 2016 and 2017 Winter Sale posts are treated as typos, based on the evidence in each
#      entry's note. I kept date-only ends at 10:00 PST.
#   6. 2012 Summer end. Valve's start post says "lasts through Monday, July 23rd", while its final-day post is dated
#      07-22. I set `end` = 2012-07-23 (10:00 PDT). A Wayback snapshot confirms the sale was over by the evening of
#      07-23.
#   7. Lunar New Year Sale. I treat it as THEMED, following research-sales-calendar.md.
#      - Valve's posts confirm 2016-02-05 to 2016-02-12 (oldnews/20313) and 2018-02-15 to 2018-02-19 ("Discounts
#        end Monday at 10am Pacific", oldnews/37184).
#      - RPS covered a 2016 and a 2018 edition. I did not check the dates of the 2017 edition. Valve's News feed
#        has no LNY post for Jan–Feb 2017.
#      - I found no LNY sale in 2012–2015.
#   8. Spring. Nothing in 2012–2018 counts as a Spring seasonal sale.
#      - "Spring Indie Sale" 2013-03-21 to ~03-29 (oldnews/10190) was indie-only and themed on IGF finalists.
#      - "VR Spring Sale" 2018-04-19 was a VR-only weekend sale (oldnews/39076).
#      - "Spring Cleaning" (2018-05-24; 2019-05-24) was a free-to-play/library event, not a store-wide sale.
#      - "LEGO Spring Sale" 2018-03-29 was a publisher Weekend Deal.
#   9. Halloween Sales are THEMED. They were narrow sales of about 80 to a few hundred titles. Seen in Valve posts:
#      - 2012-10-29 to 11-01 (oldnews/9225)
#      - 2013-10-29 (oldnews/11732)
#      - 2014-10-30 (oldnews/14819)
#      - 2016-10-28 to 11-01 (oldnews/25262)
#      - 2017-10-26 to 11-01 (oldnews/33893)
#      I did not check the 2015 and 2018 Halloween sales.
#   10. Black Friday / Cyber Monday. In 2012–2018 these fell inside the Autumn/Exploration sale and were not
#       separate sales. The 2015-11-23 "Syber Steam Machines - On Sale Today" was a one-day hardware offer, not a
#       seasonal sale.
#   11. Other Valve-run themed or one-off sales are not seasonal and not listed here. Examples: Big Picture launch
#       sale 2012-12-03, Greenlight Anniversary 2013, Capcom 30th 2013, Canada Day 2014, Japanese/French Indie
#       2014, Anime Sales 2015–2017, Cyberpunk 2015, Co-op 2015, Rogue-like 2015, Stealth 2015, VR Weekend 2016,
#       Shoot 'em Up 2016, VR Anniversary 2017, GDC Film Festival 2018, Games from Denmark 2018.
#   12. Deal mechanics:
#       - Through Summer 2015, seasonal sales had rotating Daily Deals (24h, or 12h in Summer 2015 and Holiday
#         2014), 8-hour Flash Sales and Community's Choice votes.
#       - From the 2015 Exploration Sale on, each game kept one price for the whole sale.
#       - Prices for a given game could therefore change within a pre-2015-winter sale. The dates above are the
#         sale-wide window.
#
