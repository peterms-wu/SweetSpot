confidence = "official"
note = "Thanksgiving-week sale. Valve: \"starts today and lasts through Monday, November 26th, 2012\". The \"DAY SIX\" post is dated 11-26 (https://store.steampowered.com/oldnews/9441). Valve's 11-27 post says \"The Steam Autumn Sale has come to a close\" and extends the Day 6 Daily Deals to Wed 11-28 10:00 PT (https://store.steampowered.com/oldnews/9447). A developer leak reported by Kotaku on 11-20 also gave \"until November 27\". The sale had Daily Deals and Flash Sales."

