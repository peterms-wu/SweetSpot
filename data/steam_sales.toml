year = 2012
start = "2012-12-20"
end = "2013-01-05"
status = "ended"
source = "https://store.steampowered.com/oldnews/9635"
confidence = "official"
note = "Posted in Valve's steam_release feed. Valve: \"starts now and the deep discounts last until Saturday, January 5th, 2013\". There were daily posts through \"DAY SIXTEEN\" on 01-04 (https://store.steampowered.com/oldnews/9686). A separate Holiday Encore on selected top titles ran from 01-05 10:00 PST to 01-07 10:00 PST (https://store.steampowered.com/oldnews/9690 and https://store.steampowered.com/oldnews/9692). The encore is not included in `end`. A leak reported by Kotaku gave Dec 20 to Jan 4. Valve's own posts are used instead. The sale had Daily Deals, Flash Sales and Community Choice votes."

